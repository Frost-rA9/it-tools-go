name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_NAME: El Shaddoll Winda

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
            artifact: it-tools-go-windows-amd64.exe
          - platform: darwin/amd64
            os: macos-13
            artifact: it-tools-go-darwin-amd64
          - platform: darwin/arm64
            os: macos-14
            artifact: it-tools-go-darwin-arm64
          - platform: linux/amd64
            os: ubuntu-latest
            artifact: it-tools-go-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Wails
        uses: wailsapp/wails-build-action@v2
        with:
          build-name: it-tools-go
          build-platform: ${{ matrix.platform }}
          go-version: '1.26'
          node-version: '24'

      - name: Collect artifact
        shell: bash
        run: |
          cd build/bin
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no build output found in build/bin" >&2
            exit 1
          fi
          mv "${files[0]}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ env.RELEASE_NAME }} — ${{ github.ref_name }}

            - Windows (amd64): `it-tools-go-windows-amd64.exe`
            - macOS (Intel): `it-tools-go-darwin-amd64`
            - macOS (Apple Silicon): `it-tools-go-darwin-arm64`
            - Linux (amd64): `it-tools-go-linux-amd64`
          files: artifacts/**/*
