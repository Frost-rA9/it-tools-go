name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_NAME: El Shaddoll Anoyatyllis

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
            artifact: it-tools-go-windows-amd64.exe
          - platform: darwin/amd64
            os: macos-14
            artifact: it-tools-go-darwin-amd64.zip
            mac: true
          - platform: darwin/arm64
            os: macos-14
            artifact: it-tools-go-darwin-arm64.zip
            mac: true
          - platform: linux/amd64
            os: ubuntu-22.04
            artifact: it-tools-go-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MinGW (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build
        run: wails build -platform ${{ matrix.platform }}

      - name: Collect artifact
        shell: bash
        run: |
          cd build/bin
          shopt -s nullglob
          if [ "${{ matrix.mac }}" = "true" ]; then
            ditto -c -k --keepParent it-tools-go.app "${{ matrix.artifact }}"
          else
            files=(*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::no build output found in build/bin" >&2
              exit 1
            fi
            mv "${files[0]}" "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ env.RELEASE_NAME }} — ${{ github.ref_name }}

            - Windows (amd64): `it-tools-go-windows-amd64.exe`
            - macOS (Intel): `it-tools-go-darwin-amd64.zip`
            - macOS (Apple Silicon): `it-tools-go-darwin-arm64.zip`
            - Linux (amd64): `it-tools-go-linux-amd64`
          files: artifacts/**/*
