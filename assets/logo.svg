<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#F2F5F7"/>
  <g transform="translate(256 256)">
    <mask id="gearHole">
      <rect x="-256" y="-256" width="512" height="512" fill="#fff"/>
      <circle r="112" fill="#000"/>
    </mask>
    <g fill="#00ADD8" mask="url(#gearHole)">
      <circle r="172"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(45)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(90)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(135)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(180)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(225)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(270)"/>
      <rect x="-42" y="-214" width="84" height="80" rx="26" transform="rotate(315)"/>
    </g>
    <g transform="rotate(-45)">
      <mask id="jaw">
        <rect x="-256" y="-256" width="512" height="512" fill="#fff"/>
        <circle cy="-104" r="42" fill="#000"/>
        <rect x="-42" y="-196" width="84" height="92" fill="#000"/>
      </mask>
      <g mask="url(#jaw)">
        <g fill="#00ADD8" stroke="#00ADD8" stroke-width="18" stroke-linejoin="round">
          <circle cy="-58" r="84"/>
          <rect x="-32" y="-58" width="64" height="296" rx="32"/>
        </g>
        <g fill="#FFFFFF">
          <circle cy="-58" r="84"/>
          <rect x="-32" y="-58" width="64" height="296" rx="32"/>
        </g>
      </g>
    </g>
  </g>
</svg>
